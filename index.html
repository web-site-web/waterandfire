<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вода и Огонь — украшения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ease: cubic-bezier(.22,.61,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#0a0a0c;
    --bg-soft:#121216;
    --card:#17171c;
    --fg:#f2f2f5;
    --fg-dim:#82828e;
    --line:rgba(255,255,255,.1);
    --accent-1:#5b5bff;
    --accent-2:#a855f7;
  }
  :root[data-theme="light"]{
    --bg:#efeeea;
    --bg-soft:#ffffff;
    --card:#e2e1dc;
    --fg:#0d0d10;
    --fg-dim:#6f6f78;
    --line:rgba(0,0,0,.1);
    --accent-1:#5b5bff;
    --accent-2:#a855f7;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html{scroll-behavior:smooth;}

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Manrope',system-ui,-apple-system,sans-serif;
    font-weight:400;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    padding-bottom:46px;
    transition:background-color .5s var(--ease), color .5s var(--ease);
  }

  /* ---------- HERO ---------- */
  .hero{
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:0 4vw;
  }
  .hero-inner{
    text-align:center;
  }
  .hero-inner h1{
    font-family:'Unbounded',sans-serif;
    font-weight:800;
    font-size:clamp(1.8rem, 8vw, 7.5rem);
    line-height:1;
    letter-spacing:-.035em;
    color:var(--fg);
    white-space:nowrap;
  }

  /* ---------- INTRO ---------- */
  .intro{
    max-width:700px;
    margin:0 auto;
    padding:10vh 5vw 14vh;
    text-align:center;
  }
  .intro h2{
    font-family:'Unbounded',sans-serif;
    font-weight:400;
    font-size:clamp(1.1rem,2.2vw,1.5rem);
    letter-spacing:-.01em;
    margin-bottom:2.6rem;
    color:var(--fg-dim);
  }

  .price-list{
    list-style:none;
    max-width:430px;
    margin:0 auto;
  }
  .price-list li{
    display:flex;
    align-items:center;
    gap:.8rem;
    padding:.85rem 0;
    font-size:1rem;
    border-bottom:1px solid var(--line);
  }
  .price-list li:last-child{border-bottom:none;}
  .price-list .name{color:var(--fg);}
  .price-list .rule{
    flex:1;
    height:1px;
    background-image:linear-gradient(90deg, var(--line) 0 3px, transparent 3px 8px);
    background-size:8px 1px;
    opacity:.9;
  }
  .price-list .val{
    font-weight:600;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:.6rem;
    margin-top:3rem;
    padding:1rem 2.8rem;
    border-radius:999px;
    background:linear-gradient(100deg, var(--accent-1), var(--accent-2));
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:600;
    font-size:1rem;
    text-decoration:none;
    letter-spacing:.01em;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
    box-shadow:0 10px 34px -10px rgba(120,80,255,.85);
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 16px 44px -10px rgba(120,80,255,1);
  }
  .cta:active{transform:translateY(0);}

  .cta-note{
    display:block;
    margin-top:.85rem;
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--fg-dim);
  }

  /* ---------- CATALOG ---------- */
  .catalog{
    max-width:1440px;
    margin:0 auto;
    padding:0 4vw 16vh;
  }
  .catalog-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:1rem;
    margin-bottom:2.5rem;
    padding-bottom:1.2rem;
    border-bottom:1px solid var(--line);
  }
  .catalog-head h2{
    font-family:'Unbounded',sans-serif;
    font-weight:700;
    font-size:clamp(1.3rem,3vw,2rem);
    letter-spacing:-.02em;
  }
  .catalog-count{
    font-size:.8rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--fg-dim);
  }

  .catalog-layout{
    display:grid;
    grid-template-columns:210px 1fr;
    gap:3rem;
    align-items:start;
  }

  .filters{
    position:sticky;
    top:2rem;
    display:flex;
    flex-direction:column;
    gap:.25rem;
  }
  .filters button{
    all:unset;
    cursor:pointer;
    padding:.72rem 1.1rem;
    border-radius:12px;
    font-family:'Manrope',sans-serif;
    font-size:.95rem;
    color:var(--fg-dim);
    transition:background-color .25s var(--ease), color .25s var(--ease);
    white-space:nowrap;
  }
  .filters button:hover{color:var(--fg);}
  .filters button.active{
    color:var(--fg);
    background:var(--card);
    font-weight:600;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(172px, 1fr));
    gap:14px;
  }

  .card{
    position:relative;
    aspect-ratio:1/1;
    border-radius:18px;
    overflow:hidden;
    background:var(--card);
    animation:fadeUp .5s var(--ease) both;
  }
  .card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    opacity:0;
    transform:scale(1.02);
    transition:opacity .55s var(--ease), transform .7s var(--ease);
  }
  .card img.loaded{opacity:1;transform:scale(1);}
  .card:hover img.loaded{transform:scale(1.06);}

  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ---------- THEME TOGGLE ---------- */
  .theme-btn{
    position:fixed;
    top:1.4rem;
    right:1.4rem;
    z-index:60;
    width:46px;
    height:46px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-soft);
    color:var(--fg);
    display:grid;
    place-items:center;
    cursor:pointer;
    transition:transform .35s var(--ease), background-color .4s var(--ease), color .4s var(--ease);
  }
  .theme-btn:hover{transform:rotate(25deg);}
  :root[data-theme="dark"] .icon-sun{display:none;}
  :root[data-theme="light"] .icon-moon{display:none;}

  /* ---------- DEMO BANNER ---------- */
  .demo-banner{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:70;
    padding:.7rem 1rem;
    text-align:center;
    font-size:.72rem;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--fg-dim);
    background:color-mix(in srgb, var(--bg-soft) 82%, transparent);
    border-top:1px solid var(--line);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:820px){
    .catalog-layout{
      grid-template-columns:1fr;
      gap:1.6rem;
    }
    .filters{
      position:static;
      flex-direction:row;
      overflow-x:auto;
      gap:.4rem;
      padding-bottom:.5rem;
      scrollbar-width:none;
    }
    .filters::-webkit-scrollbar{display:none;}
    .filters button{
      padding:.6rem .95rem;
      border:1px solid var(--line);
      font-size:.88rem;
    }
    .grid{
      grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
      gap:10px;
    }
    .card{border-radius:14px;}
    .catalog-head{flex-direction:column;gap:.4rem;}
  }

  @media (max-width:480px){
    .grid{grid-template-columns:repeat(2, 1fr);}
    .theme-btn{top:1rem;right:1rem;width:42px;height:42px;}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

  <button class="theme-btn" id="themeToggle" aria-label="Сменить тему">
    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>

  <header class="hero">
    <div class="hero-inner">
      <h1>Вода и Огонь</h1>
    </div>
  </header>

  <section class="intro">
    <h2>Приветственный текст</h2>

    <ul class="price-list">
      <li>
        <span class="name">Браслеты</span>
        <span class="rule"></span>
        <span class="val">1500 ₽</span>
      </li>
      <li>
        <span class="name">Чокеры</span>
        <span class="rule"></span>
        <span class="val">2000 ₽</span>
      </li>
      <li>
        <span class="name">Брелки</span>
        <span class="rule"></span>
        <span class="val">не знаю сколько</span>
      </li>
      <li>
        <span class="name">Серьги</span>
        <span class="rule"></span>
        <span class="val">500 ₽</span>
      </li>
    </ul>

    <a class="cta" href="https://max.ru/" target="_blank" rel="noopener">Написать в МАХ</a>
    <small class="cta-note">для заказа</small>
  </section>

  <section class="catalog">
    <div class="catalog-head">
      <h2>Каталог</h2>
      <span class="catalog-count" id="catalogCount"></span>
    </div>

    <div class="catalog-layout">
      <aside class="filters" id="filters">
        <button data-cat="braslets" class="active">Браслеты</button>
        <button data-cat="sergis">Серьги</button>
        <button data-cat="chokers">Чокеры</button>
        <button data-cat="breloks">Брелки</button>
      </aside>

      <div class="grid" id="grid"></div>
    </div>
  </section>

  <div class="demo-banner">демо-сайт, не для продажи</div>

  <script>
    /* ============================================================
       ТЕМА
       ============================================================ */

    const root = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      root.setAttribute('data-theme', savedTheme);
    }

    themeToggle.addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    /* ============================================================
       КАТАЛОГ
       ============================================================ */

    const CATALOG = {
      braslets: { folder: 'braslets', prefix: 'braslet', count: 60 },
      sergis:   { folder: 'sergis',   prefix: 'sergi',   count: 16 },
      chokers:  { folder: 'chokers',  prefix: 'choker',  count: 25 },
      breloks:  { folder: 'breloks',  prefix: 'brelok',  count: 4  }
    };

    const grid = document.getElementById('grid');
    const countLabel = document.getElementById('catalogCount');
    const filters = document.getElementById('filters');

    function createImage(folder, name, card) {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.decoding = 'async';
      img.alt = name;

      const tries = ['jpg', 'png', 'webp', 'jpeg'];
      let attempt = 0;

      img.onload = () => img.classList.add('loaded');

      img.onerror = () => {
        attempt++;
        if (attempt < tries.length) {
          img.src = `${folder}/${name}.${tries[attempt]}`;
        } else {
          img.remove();
          card.remove();
        }
      };

      img.src = `${folder}/${name}.${tries[0]}`;
      return img;
    }

    function renderCategory(key) {
      const data = CATALOG[key];
      if (!data) return;

      grid.innerHTML = '';
      const fragment = document.createDocumentFragment();

      for (let i = 1; i <= data.count; i++) {
        const name = data.prefix + i;

        const card = document.createElement('div');
        card.className = 'card';
        card.style.animationDelay = Math.min(i * 14, 420) + 'ms';

        card.appendChild(createImage(data.folder, name, card));
        fragment.appendChild(card);
      }

      grid.appendChild(fragment);
      countLabel.textContent = data.count + ' шт.';
    }

    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      filters.querySelectorAll('button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCategory(btn.dataset.cat);
    });

    renderCategory('braslets');
  </script>
</body>
</html>
